name: DAST Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t secure-devsecops-app .

      - name: Run Flask application
        run: |
          docker run -d \
            -p 5000:5000 \
            --name flask-app \
            secure-devsecops-app \
            flask --app app.py run --host=0.0.0.0 --port=5000

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs flask-app
          exit 1

      - name: Run OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
